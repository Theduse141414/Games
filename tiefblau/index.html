<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06203c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tiefblau – Tauchen &amp; Sushi</title>
<style>
  :root { --bg:#06203c; --panel:#0d2f52; --panel2:#123d68; --fg:#eaf6ff; --dim:#9fc2dc;
    --accent:#ffcf33; --accent2:#ff7a59; --ok:#5fe0a0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  button { font:inherit; color:inherit; touch-action:manipulation; cursor:pointer; }

  #pauseBtn { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    width:44px; height:44px; display:none; align-items:center; justify-content:center; padding:0;
    background:rgba(6,32,60,.45); border:1px solid rgba(234,246,255,.3); border-radius:12px; opacity:.8; }
  #pauseBtn svg { width:20px; height:20px; }
  body.ingame #pauseBtn { display:flex; }

  .overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    background:rgba(3,14,30,.55); }
  .overlay.show { display:flex; }
  .panel { width:100%; max-width:460px; max-height:100%; overflow-y:auto; touch-action:pan-y;
    background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid rgba(234,246,255,.16);
    border-radius:22px; padding:20px 18px; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .panel h1 { margin:0; font-size:42px; letter-spacing:.5px; line-height:1; text-align:center; }
  .panel h1 small { display:block; margin-top:8px; font-size:15px; font-weight:600; color:var(--accent); letter-spacing:2px; text-transform:uppercase; }
  .panel h2 { margin:0 0 4px; font-size:22px; text-align:center; }
  .panel p { margin:8px 0; color:var(--dim); font-size:14.5px; line-height:1.45; text-align:center; }
  .panel h3 { margin:16px 0 8px; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); }
  .big { display:block; width:100%; min-height:54px; margin-top:12px; border:0; border-radius:16px;
    background:var(--accent); color:#1a2b3c; font-size:18px; font-weight:800; }
  .big:active { transform:translateY(1px); filter:brightness(.92); }
  .big.sec { background:rgba(234,246,255,.1); color:var(--fg); border:1px solid rgba(234,246,255,.22); font-weight:600; min-height:48px; font-size:16px; }
  .how { display:grid; gap:8px; margin:16px 0 4px; }
  .how div { display:flex; gap:12px; align-items:center; background:rgba(3,14,30,.3); border-radius:14px; padding:10px 12px; font-size:14.5px; text-align:left; }
  .how b { font-size:24px; width:32px; text-align:center; flex:none; }
  .how span { color:var(--fg); line-height:1.35; }
  .how em { font-style:normal; color:var(--accent); font-weight:700; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .coins { font-size:24px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .stars { font-size:20px; letter-spacing:2px; color:var(--accent); }
  .stars i { font-style:normal; color:rgba(234,246,255,.25); }
  .repbar { height:6px; border-radius:3px; background:rgba(3,14,30,.45); overflow:hidden; margin-top:6px; }
  .repbar div { height:100%; background:var(--accent); border-radius:3px; }
  .note { background:rgba(3,14,30,.32); border-radius:14px; padding:10px 12px; margin-top:10px; font-size:14.5px; color:var(--fg); text-align:center; line-height:1.45; }
  .note b { color:var(--accent); }
  .note.bad b { color:var(--accent2); }

  .upg { display:flex; align-items:center; gap:10px; background:rgba(3,14,30,.3); border-radius:14px; padding:9px 10px; margin-bottom:7px; }
  .upg .ico { font-size:24px; width:34px; text-align:center; flex:none; }
  .upg .txt { flex:1; min-width:0; }
  .upg .nm { font-weight:700; font-size:15px; }
  .upg .vl { font-size:12.5px; color:var(--dim); margin-top:1px; }
  .upg .vl b { color:var(--ok); }
  .pips { display:flex; gap:3px; margin-top:5px; }
  .pips i { width:16px; height:5px; border-radius:3px; background:rgba(234,246,255,.18); }
  .pips i.on { background:var(--ok); }
  .buy { flex:none; min-width:84px; min-height:46px; border:0; border-radius:12px; background:var(--accent); color:#1a2b3c; font-weight:800; font-size:15px; padding:0 10px; }
  .buy:disabled { background:rgba(234,246,255,.12); color:rgba(234,246,255,.45); }
  .buy.max { background:transparent; color:var(--ok); }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:flex; align-items:center; gap:5px; background:rgba(3,14,30,.3); border-radius:12px; padding:4px 9px 4px 5px; font-size:13.5px; font-weight:600; }
  .chip img { width:34px; height:26px; object-fit:contain; }
  .chip.unk { opacity:.45; }
  .chip.unk img { filter:brightness(0) invert(.75); }
  .chip small { color:var(--dim); font-weight:500; }
  .catch { display:grid; gap:6px; margin-top:12px; }
  .catch .chip { justify-content:space-between; padding:6px 12px 6px 8px; font-size:15px; }
  .catch .chip span { display:flex; align-items:center; gap:8px; }
  .catch .chip img { width:44px; height:32px; }
  .empty { color:var(--dim); font-size:14px; text-align:center; padding:6px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="pauseBtn" type="button" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
</button>

<div id="title" class="overlay show"><div class="panel">
  <h1>Tiefblau<small>Tauchen &amp; Sushi</small></h1>
  <p>Tagsüber fängst du Fische am Riff – abends servierst du sie in deiner Sushi-Bar.</p>
  <div class="how">
    <div><b>👆</b><span><em>Finger ziehen</em> – Mika schwimmt in diese Richtung.</span></div>
    <div><b>🎯</b><span><em>Kurz tippen</em> – Harpune schießt, sie zielt von selbst.</span></div>
    <div><b>⛵</b><span><em>Zurück zum Boot</em>, bevor die Luft ausgeht.</span></div>
    <div><b>🍣</b><span>Abends: <em>Gäste antippen</em> zum Servieren.</span></div>
  </div>
  <button class="big" id="btnPlay" type="button">Abtauchen</button>
  <button class="big sec" id="btnNew" type="button" style="display:none">Neues Spiel</button>
</div></div>

<div id="pause" class="overlay"><div class="panel">
  <h2>Pause</h2>
  <button class="big" id="btnResume" type="button">Weiter</button>
  <button class="big sec" id="btnSound" type="button">Ton: an</button>
  <button class="big sec" id="btnFull" type="button">Vollbild</button>
  <button class="big sec" id="btnQuit" type="button">Zum Titel</button>
</div></div>

<div id="summary" class="overlay"><div class="panel" id="summaryBody"></div></div>
<div id="shop" class="overlay"><div class="panel" id="shopBody"></div></div>

<script>
(() => {
"use strict";

/* ───────────── Grundlagen ───────────── */
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const canvas = $("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, S = 1, VW = 400, VH = 700;
const inset = { t: 0, r: 0, b: 0, l: 0 };
const probe = document.createElement("div");
probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
document.body.appendChild(probe);
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  S = clamp(Math.min(W, H) / 400, 0.6, 2.4);
  VW = W / S; VH = H / S;
  const cs = getComputedStyle(probe);
  inset.t = (parseFloat(cs.paddingTop) || 0) / S; inset.r = (parseFloat(cs.paddingRight) || 0) / S;
  inset.b = (parseFloat(cs.paddingBottom) || 0) / S; inset.l = (parseFloat(cs.paddingLeft) || 0) / S;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 150));
resize();

/* ───────────── Ton ───────────── */
let actx = null, muted = false;
try { muted = localStorage.getItem("tiefblau-mute") === "1"; } catch (e) {}
function audioInit() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function tone(f, dur, type = "sine", vol = 0.12, f2 = 0, delay = 0) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
const SFX = {
  shoot: () => tone(900, .12, "triangle", .1, 220),
  hit: () => tone(240, .08, "square", .08, 120),
  catch: () => { tone(523, .09, "triangle", .12); tone(784, .14, "triangle", .12, 0, .08); },
  hurt: () => tone(170, .28, "sawtooth", .13, 60),
  coin: () => { tone(988, .07, "square", .05); tone(1319, .13, "square", .05, 0, .06); },
  bubble: () => tone(380, .18, "sine", .1, 950),
  serve: () => tone(660, .09, "triangle", .1, 900),
  fail: () => tone(210, .3, "sawtooth", .09, 90),
  buy: () => { tone(523, .08, "triangle", .11); tone(659, .08, "triangle", .11, 0, .08); tone(784, .18, "triangle", .11, 0, .16); },
  warn: () => tone(880, .09, "square", .05),
  tap: () => tone(520, .05, "sine", .06)
};
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

/* ───────────── Spieldaten ───────────── */
const WW = 900, FLOOR = 2700, BOATX = 450;          // 10 Einheiten = 1 m
const ZONES = [[60, 700], [700, 1500], [1500, 2640]];

// beh: Verhalten · shy: Fluchtdistanz · dmg: Schaden bei Berührung · aggro: Angriffsdistanz
const SP = {
  sardine: { name: "Sardine",       L: 22,  hp: 1,  kg: 0.5, price: 8,  por: 1, speed: 55, rx: 30,  ry: 18, shy: 60, meat: "#e9b7a6" },
  clown:   { name: "Clownfisch",    L: 26,  hp: 1,  kg: 0.8, price: 12, por: 1, speed: 38, rx: 46,  ry: 30, shy: 45, meat: "#ffb37a" },
  tang:    { name: "Doktorfisch",   L: 32,  hp: 1,  kg: 1.2, price: 10, por: 2, speed: 50, rx: 120, ry: 60, shy: 70, meat: "#f3d9d0" },
  puffer:  { name: "Kugelfisch",    L: 31,  hp: 2,  kg: 1.5, price: 22, por: 2, speed: 26, rx: 80,  ry: 50, dmg: 6, meat: "#fff3e6" },
  urchin:  { name: "Seeigel",       L: 20,  hp: 1,  kg: 0.5, price: 30, por: 1, pickup: true, meat: "#f0a52e" },
  tuna:    { name: "Thunfisch",     L: 56,  hp: 3,  kg: 4,   price: 20, por: 4, speed: 95, rx: 240, ry: 90, shy: 95, fleeSpeed: 215, meat: "#c8323f" },
  lion:    { name: "Rotfeuerfisch", L: 36,  hp: 2,  kg: 2,   price: 30, por: 2, speed: 22, rx: 70,  ry: 50, dmg: 7, meat: "#f6e3da" },
  squid:   { name: "Kalmar",        L: 42,  hp: 2,  kg: 2.5, price: 22, por: 3, speed: 60, rx: 150, ry: 90, shy: 80, meat: "#fbfbf5" },
  grouper: { name: "Zackenbarsch",  L: 62,  hp: 5,  kg: 6,   price: 18, por: 5, speed: 24, rx: 90,  ry: 50, meat: "#f1e4dc" },
  lantern: { name: "Laternenfisch", L: 20,  hp: 1,  kg: 0.4, price: 26, por: 1, speed: 50, rx: 34,  ry: 22, shy: 55, glow: "#7df9ff", meat: "#c9e9f0" },
  angler:  { name: "Anglerfisch",   L: 46,  hp: 4,  kg: 3,   price: 48, por: 3, speed: 20, rx: 80,  ry: 50, dmg: 9,  aggro: 120, chase: 140, glow: "#fff6a0", meat: "#f3e9ef" },
  shark:   { name: "Riffhai",       L: 112, hp: 8,  kg: 9,   price: 36, por: 6, speed: 60, rx: 300, ry: 120, dmg: 12, aggro: 250, chase: 168, meat: "#e9d5d8" },
  mola:    { name: "Mondfisch",     L: 100, hp: 14, kg: 14,  price: 50, por: 8, speed: 16, rx: 200, ry: 100, meat: "#f7ede9" },
  jelly:   { name: "Qualle",        L: 30,  hp: 99, kg: 0,   price: 0,  por: 0, speed: 0, dmg: 6, hazard: true, glow: "#ff9de1" }
};
const SP_ORDER = ["sardine", "clown", "tang", "puffer", "urchin", "tuna", "lion", "squid", "grouper", "lantern", "angler", "shark", "mola"];

const UPG = {
  tank:    { name: "Sauerstoffflasche", ico: "🫧", vals: [60, 80, 105, 135, 170], fmt: v => v + " s Luft", k: 1 },
  harpoon: { name: "Harpune",           ico: "🔱", vals: [1, 2, 3, 4, 6],         fmt: v => "Schaden " + v, k: 1.1 },
  bag:     { name: "Fangnetz",          ico: "🧺", vals: [8, 13, 20, 30, 45],     fmt: v => v + " kg", k: 1 },
  suit:    { name: "Tauchanzug",        ico: "🤿", vals: [70, 110, 150, 200, 270], fmt: v => "bis " + v + " m", k: 1.2 },
  fins:    { name: "Flossen",           ico: "💨", vals: [135, 155, 175, 195, 220], fmt: v => "Tempo " + v, k: 0.8 }
};
const UPG_COST = [90, 260, 620, 1300];
const HARP_RANGE = [170, 190, 215, 240, 270], HARP_RELOAD = [.85, .75, .65, .55, .45];
const REP_STEPS = [6, 16, 32, 56, 90];

const SAVE_KEY = "tiefblau-save-v1";
function freshGame() { return { day: 1, money: 0, up: { tank: 0, harpoon: 0, bag: 0, suit: 0, fins: 0 }, stock: {}, rep: 0, seen: {}, best: 0, tut: {}, won: false }; }
let G = freshGame();
let hasSave = false;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); hasSave = true; } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const d = JSON.parse(raw); if (!d || typeof d.day !== "number") return false;
    G = Object.assign(freshGame(), d); G.up = Object.assign(freshGame().up, d.up || {});
    for (const k in G.stock) if (!SP[k] || !(G.stock[k] > 0)) delete G.stock[k];
    return true;
  } catch (e) { return false; }
}
const upVal = k => UPG[k].vals[G.up[k]];
const upCost = k => Math.round(UPG_COST[G.up[k]] * UPG[k].k / 10) * 10;
function stars() { let s = 0; for (const v of REP_STEPS) if (G.rep >= v) s++; return s; }
const stockTotal = () => Object.values(G.stock).reduce((a, b) => a + b, 0);

/* ───────────── Zeichen-Helfer ───────────── */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function txt(c, s, x, y, size, col = "#fff", align = "center", weight = 700) {
  c.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  c.textAlign = align; c.textBaseline = "middle"; c.fillStyle = col; c.fillText(s, x, y);
}
function txtO(c, s, x, y, size, col = "#fff", align = "center") {
  c.font = `800 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  c.textAlign = align; c.textBaseline = "middle"; c.lineJoin = "round";
  c.lineWidth = Math.max(2.5, size * 0.22); c.strokeStyle = "rgba(3,14,30,.75)"; c.strokeText(s, x, y);
  c.fillStyle = col; c.fillText(s, x, y);
}

// Standard-Fischkörper, Nase zeigt nach rechts, Länge L
function fishBase(c, L, Hh, col, belly, fin, wag, deco) {
  c.fillStyle = fin;
  c.beginPath(); c.moveTo(-L * .34, 0); c.lineTo(-L * .5, -Hh * .52 + wag * Hh * .22); c.lineTo(-L * .43, wag * Hh * .18);
  c.lineTo(-L * .5, Hh * .52 + wag * Hh * .22); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-L * .12, -Hh * .4); c.lineTo(L * .0, -Hh * .74); c.lineTo(L * .17, -Hh * .38); c.closePath(); c.fill();
  c.save();
  c.beginPath(); c.ellipse(L * .05, 0, L * .45, Hh * .5, 0, 0, TAU); c.clip();
  c.fillStyle = col; c.fillRect(-L, -Hh, 2 * L, 2 * Hh);
  c.fillStyle = belly; c.fillRect(-L, Hh * .14, 2 * L, Hh);
  if (deco) deco();
  c.restore();
  c.fillStyle = fin; c.beginPath(); c.ellipse(L * .06, Hh * .14, L * .09, Hh * .13, .6, 0, TAU); c.fill();
  const er = Math.max(1.3, Hh * .14);
  c.fillStyle = "#fff"; circ(c, L * .33, -Hh * .1, er); c.fill();
  c.fillStyle = "#0b1a2a"; circ(c, L * .35, -Hh * .1, er * .55); c.fill();
}

function drawSp(c, id, L, t, o) {
  o = o || {};
  const wag = Math.sin(t * 9);
  switch (id) {
    case "sardine":
      fishBase(c, L, L * .34, "#6f97bd", "#eef5fa", "#5d83a8", wag, () => { c.fillStyle = "rgba(255,255,255,.5)"; c.fillRect(-L * .4, -L * .02, L * .8, L * .03); });
      break;
    case "clown":
      fishBase(c, L, L * .52, "#f47b20", "#fb9a48", "#e2650f", wag, () => {
        c.fillStyle = "#fff"; c.fillRect(L * .16, -L, L * .09, 2 * L); c.fillRect(-L * .12, -L, L * .1, 2 * L); c.fillRect(-L * .36, -L, L * .06, 2 * L);
      });
      break;
    case "tang":
      fishBase(c, L, L * .56, "#2767e0", "#2f74ee", "#ffd23f", wag, () => {
        c.strokeStyle = "#0e2a66"; c.lineWidth = L * .09; c.beginPath(); c.moveTo(L * .22, -L * .12); c.quadraticCurveTo(-L * .05, -L * .26, -L * .34, -L * .04); c.stroke();
      });
      break;
    case "tuna":
      fishBase(c, L, L * .42, "#1d3f73", "#dbe4ec", "#24365a", wag, () => { c.fillStyle = "#ffd23f"; for (let i = 0; i < 4; i++) c.fillRect(-L * (.2 + i * .06), -L * .19, L * .03, L * .04); });
      break;
    case "lion": {
      c.strokeStyle = "#f3d9c6"; c.lineWidth = Math.max(1, L * .035); c.lineCap = "round";

  const r = rng(day * 7919 + 31);

    if (Math.abs(x - BOATX) < 130 && y < 430) continue;
    if (world.rocks.some(o => Math.hypot(o.x - x, o.y - y) < o.r + rad + 70)) continue;
    const pts = []; for (let k = 0; k < 11; k++) pts.push(rad * rr_(.82, 1.1));
    world.rocks.push({ x, y, r: rad, pts });
  }
  const top = (rock, off = 0) => ({ x: rock.x + off * rock.r * .6, y: rock.y - rock.r * Math.sqrt(1 - off * off * .36) * .86 });
  const decor = (x, y, deep) => {
    const k = r();

  };
  for (let y = 90; y < FLOOR; y += rr_(45, 95)) { const left = r() < .5; decor(left ? wallL(y) + 2 : wallR(y) - 2, y, y / FLOOR); }
  for (let x = 30; x < WW; x += rr_(28, 60)) decor(x, FLOOR + 2, 1);
  for (const rock of world.rocks) { const n = 1 + (r() * 3 | 0); for (let i = 0; i < n; i++) { const p = top(rock, rr_(-.9, .9)); decor(p.x, p.y + 3, rock.y / FLOOR); } }

  for (let i = 0; i < 5; i++) {

    world.pickups.push({ type: "chest", x: p.x, y: p.y - 8, t: 0, coins: Math.round((25 + p.y / 22 + r() * 30) / 5) * 5 });
  }

  // Lebewesen
  const fishAt = (sp, x, y, school) => {
    const f = { sp, x, y, vx: 0, vy: 0, dir: r() < .5 ? 1 : -1, hp: SP[sp].hp, home: { x, y }, school: school || null, t: r() * 10, wt: 0, tx: x, ty: y, flee: 0, rest: 0, cd: 0, puff: 0, hpShow: 0, reel: false, dead: false };

    if (keys.has("ArrowLeft") || keys.has("a")) x -= 1; if (keys.has("ArrowRight") || keys.has("d")) x += 1;

function floatText(s, x, y, col = "#fff") { floats.push({ s, x, y, t: 0, col }); }

function hurt(dmg, src) {
  const d = diver; if (d.inv > 0 || !d.alive) return;
  d.o2 -= dmg; d.inv = 1.1; shake = .35;
  const a = Math.atan2(d.y - src.y, d.x - src.x); d.vx = Math.cos(a) * 230; d.vy = Math.sin(a) * 230;
  floatText("−" + dmg + " s Luft", d.x, d.y - 26, "#ff8a7a"); bubbles(d.x, d.y, 10, 12); SFX.hurt(); buzz(70);
}

function hitFish(f) {
  const h = harp, d = diver, sp = SP[f.sp];
  f.hp -= h.dmg; f.hpShow = 2.5; sparks(f.x, f.y, "#fff"); SFX.hit();
  if (f.hp <= 0) {
    if (d.kg + sp.kg > d.cap + 1e-6) { f.hp = 1; f.flee = 2.5; say("Netz voll! Zurück zum Boot ⛵"); buzz(30); h.state = "back"; return; }
    f.reel = true; h.fish = f; h.state = "back";
  } else {
    if (sp.aggro) { f.rest = 0; f.enraged = 6; } else f.flee = 1.8;
    if (f.sp === "squid") { world.ink.push({ x: f.x, y: f.y, t: 0 }); f.flee = 2.6; }
    h.state = "back";
  }
}

function collect(f) {
  const d = diver, sp = SP[f.sp];
  f.dead = true; d.catch.push(f.sp); d.kg += sp.kg;
  floatText("+ " + sp.name, d.x, d.y - 30, "#ffe37a"); SFX.catch(); buzz(20); bubbles(d.x, d.y, 4);
}

function updateSchool(sc, dt) {
  sc.wt -= dt;
  if (sc.wt <= 0) { sc.wt = rand(2.5, 6); sc.tx = clamp(sc.hx + rand(-160, 160), wallL(sc.hy) + 90, wallR(sc.hy) - 90); sc.ty = sc.hy + rand(-70, 70); }
  const dx = sc.tx - sc.x, dy = sc.ty - sc.y, l = Math.hypot(dx, dy);
  if (l > 4) { sc.x += dx / l * 26 * dt; sc.y += dy / l * 26 * dt; }
}

function updateFish(f, dt) {
  const sp = SP[f.sp], d = diver;
  f.t += dt; if (f.cd > 0) f.cd -= dt; if (f.hpShow > 0) f.hpShow -= dt;
  if (f.reel) return;
  const dx = d.x - f.x, dy = d.y - f.y, dist = Math.hypot(dx, dy) || 1;
  if (dist > 1100) return;                       // weit entfernte Fische ruhen
  if (f.sp === "jelly") {
    f.y = f.home.y + Math.sin(f.t * .7) * 46; f.x = f.home.x + Math.sin(f.t * .31) * 22;
  } else {
    f.wt -= dt;
    if (f.wt <= 0) {
      const h = f.school || f.home;
      f.wt = f.school ? rand(.5, 1.3) : rand(1.5, 4);
      f.tx = h.x + rand(-1, 1) * sp.rx; f.ty = h.y + rand(-1, 1) * sp.ry;
    }
    let mode = "wander", spd = sp.speed;
    if (f.flee > 0) { f.flee -= dt; mode = "flee"; }
    else if (sp.shy && dist < sp.shy + (Math.hypot(d.vx, d.vy) > 60 ? 25 : 0)) { f.flee = .9; mode = "flee"; }
    if (sp.aggro && d.alive) {
      if (f.enraged > 0) f.enraged -= dt;
      if (f.rest > 0) f.rest -= dt;
      else if (dist < sp.aggro || f.enraged > 0) mode = "chase";
    }
    let vxT, vyT;
    if (mode === "flee") { const v = sp.fleeSpeed || spd * 2.3; vxT = -dx / dist * v; vyT = -dy / dist * v * .7; }
    else if (mode === "chase") { vxT = dx / dist * sp.chase; vyT = dy / dist * sp.chase; }
    else {
      if (f.sp === "squid") spd *= .35 + Math.max(0, Math.sin(f.t * 3)) * 1.3;
      const ex = f.tx - f.x, ey = f.ty - f.y, el = Math.hypot(ex, ey);
      if (el < 8) { vxT = 0; vyT = 0; f.wt = Math.min(f.wt, .5); } else { vxT = ex / el * spd; vyT = ey / el * spd; }
    }
    const k = Math.min(1, dt * (mode === "wander" ? 2 : 4.5));
    f.vx += (vxT - f.vx) * k; f.vy += (vyT - f.vy) * k;
    f.x += f.vx * dt; f.y += f.vy * dt;
    const r = hitR(f);
    f.y = clamp(f.y, 26, FLOOR - 14 - r * .5);
    const wl = wallL(f.y) + r, wr = wallR(f.y) - r;
    if (f.x < wl) { f.x = wl; f.vx = Math.abs(f.vx); f.wt = 0; } else if (f.x > wr) { f.x = wr; f.vx = -Math.abs(f.vx); f.wt = 0; }
    if (Math.abs(f.vx) > 4) f.dir = f.vx > 0 ? 1 : -1;
    if (f.sp === "puffer") { const want = dist < 100 ? 1 : 0; f.puff += (want - f.puff) * Math.min(1, dt * (want ? 6 : 1.2)); }
  }
  const dmg = sp.dmg && (f.sp !== "puffer" || f.puff > .5) ? sp.dmg : 0;
  if (dmg && f.cd <= 0 && d.inv <= 0 && d.alive && dist < hitR(f) + 13) { hurt(dmg, f); f.cd = 1.3; if (sp.aggro) { f.rest = 2.4; f.enraged = 0; f.vx = -dx / dist * 120; f.vy = -dy / dist * 120; } }
}

function solidAt(x, y) {
  if (y < 0 || y > FLOOR - 4 || x < wallL(y) || x > wallR(y)) return true;
  for (const o of world.rocks) if ((x - o.x) ** 2 + (y - o.y) ** 2 < (o.r * .9) ** 2) return true;
  return false;
}

function updateHarpoon(dt) {
  const h = harp, d = diver;
  if (h.state === "out") {
    const steps = 3;
    for (let i = 0; i < steps && h.state === "out"; i++) {
      h.x += h.vx * dt / steps; h.y += h.vy * dt / steps; h.dist += 820 * dt / steps;
      for (const f of world.fish) { if (catchable(f) && Math.hypot(f.x - h.x, f.y - h.y) < hitR(f) + 7) { hitFish(f); break; } }
      if (h.state === "out" && (h.dist >= h.range || solidAt(h.x, h.y))) { h.state = "back"; if (h.dist < h.range) sparks(h.x, h.y, "#9fb4c8", 4); }
    }
  } else if (h.state === "back") {
    const dx = d.x - h.x, dy = d.y - h.y, l = Math.hypot(dx, dy), v = 980 * dt;
    if (l <= Math.max(v, 18)) {
      if (h.fish) { collect(h.fish); h.fish = null; }
      h.state = "reload"; h.cool = h.reload;
    } else { h.x += dx / l * v; h.y += dy / l * v; if (h.fish) { h.fish.x = h.x; h.fish.y = h.y; } }
  } else if (h.state === "reload") { h.cool -= dt; if (h.cool <= 0) h.state = "ready"; }
}

function updateDive(dt) {
  const d = diver;
  time += dt;
  if (toast.t > 0) toast.t -= dt;
  if (shake > 0) shake -= dt;

  // Bewegung
  const inp = d.alive ? inputVec() : { x: 0, y: 0 };
  const moving = inp.x || inp.y;
  if (moving && !G.tut.move) { d.moveT = (d.moveT || 0) + dt; if (d.moveT > 1.2) G.tut.move = true; }
  const k = Math.min(1, dt * (moving ? 5 : 1.8));
  d.vx += (inp.x * d.speed - d.vx) * k; d.vy += (inp.y * d.speed - d.vy + (d.alive ? 0 : -30)) * k;
  d.x += d.vx * dt; d.y += d.vy * dt;
  d.y = clamp(d.y, 10, FLOOR - 20);
  d.x = clamp(d.x, wallL(d.y) + 16, wallR(d.y) - 16);
  for (const o of world.rocks) {
    const dx = d.x - o.x, dy = d.y - o.y, l = Math.hypot(dx, dy), min = o.r * .9 + 14;
    if (l < min && l > 0) { d.x = o.x + dx / l * min; d.y = o.y + dy / l * min; }
  }
  const sp = Math.hypot(d.vx, d.vy);
  if (Math.abs(d.vx) > 12) d.dir = d.vx > 0 ? 1 : -1;
  const wantTilt = sp > 15 ? clamp(Math.atan2(d.vy, Math.abs(d.vx)), -1.2, 1.2) : 0;
  d.tilt += (wantTilt - d.tilt) * Math.min(1, dt * 6);
  d.kick += dt * (3 + sp * .06);
  if (d.inv > 0) d.inv -= dt;
  d.deepest = Math.max(d.deepest, d.y / 10);
  if (d.y > 170) d.deep = true;

  // Luft
  if (d.alive) {
    const depthM = d.y / 10, over = depthM > d.maxDepth + .5;
    d.o2 -= dt * (1 + depthM / 220) * (over ? 3.5 : 1);
    if (over) { d.warnT -= dt; if (d.warnT <= 0) { d.warnT = 2.5; say("Zu tief! Die Luft schwindet schneller ⚠"); SFX.warn(); buzz(40); } }
    else if (d.o2 < d.o2max * .25) { d.warnT -= dt; if (d.warnT <= 0) { d.warnT = 1.1; SFX.warn(); } }
    d.bub -= dt; if (d.bub <= 0) { d.bub = rand(.5, 1.1); bubbles(d.x + d.dir * 20, d.y - 6, 2, 2); }
    if (d.o2 <= 0) { d.o2 = 0; d.alive = false; d.endT = 1.8; say("Die Luft ist aus…", 2); SFX.fail(); buzz(200); }
  } else { d.endT -= dt; if (d.endT <= 0) { endDive(false); return; } }

  // Ziel + Harpune
  target = d.alive && harp.state !== "out" ? findTarget() : (harp.state === "out" ? target : null);
  if (target && (target.dead || target.reel)) target = null;
  if (harp.state !== "out") {
    let want = d.aim;
    if (target) want = Math.atan2(target.y - d.y, target.x - d.x);
    else if (sp > 20) want = Math.atan2(d.vy, d.vx);
    let diff = ((want - d.aim + Math.PI) % TAU + TAU) % TAU - Math.PI;
    d.aim += diff * Math.min(1, dt * 12);
  }
  updateHarpoon(dt);

  for (const sc of world.schools) updateSchool(sc, dt);
  for (const f of world.fish) if (!f.dead) updateFish(f, dt);
  for (let i = world.fish.length - 1; i >= 0; i--) if (world.fish[i].dead) world.fish.splice(i, 1);
  for (const ink of world.ink) ink.t += dt;
  world.ink = world.ink.filter(i => i.t < 4);

  // Fundstücke
  for (const p of world.pickups) {
    p.t += dt; if (p.taken || !d.alive) continue;
    if (Math.hypot(p.x - d.x, p.y - d.y) < 30) {
      if (p.type === "o2") { p.taken = true; d.o2 = Math.min(d.o2max, d.o2 + 22); floatText("+22 s Luft", p.x, p.y - 20, "#9ff0ff"); bubbles(p.x, p.y, 14, 10); SFX.bubble(); }
      else if (p.type === "chest") { p.taken = true; d.coins += p.coins; floatText("+" + p.coins + " 🪙", p.x, p.y - 22, "#ffe37a"); sparks(p.x, p.y, "#ffe37a", 14); SFX.coin(); buzz(25); }
      else if (p.type === "urchin") {
        if (d.kg + SP.urchin.kg <= d.cap + 1e-6) { p.taken = true; d.catch.push("urchin"); d.kg += SP.urchin.kg; floatText("+ Seeigel", p.x, p.y - 20, "#ffe37a"); SFX.catch(); }
        else if (!(p.fullT > 0)) { p.fullT = 2; say("Netz voll! Zurück zum Boot ⛵"); }
      }
    }
    if (p.fullT > 0) p.fullT -= dt;
  }

  // Auftauchen am Boot
  if (d.alive && d.deep && d.y < 48 && Math.abs(d.x - BOATX) < 95) { d.exitT += dt; if (d.exitT >= 1) { endDive(true); return; } }
  else d.exitT = Math.max(0, d.exitT - dt * 2);

  // Partikel
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.type === "bub") { p.vx *= .98; if (p.y < 2) p.t = p.life; } else { p.vx *= .92; p.vy *= .92; } }
  parts = parts.filter(p => p.t < p.life); if (parts.length > 260) parts.splice(0, parts.length - 260);
  for (const f of floats) { f.t += dt; f.y -= 28 * dt; }
  floats = floats.filter(f => f.t < 1.4);
}

function endDive(ok) {
  const d = diver;
  let list = d.catch.slice(), lost = 0;
  if (!ok) { for (let i = list.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[list[i], list[j]] = [list[j], list[i]]; } const keep = Math.floor(list.length / 2); lost = list.length - keep; list = list.slice(0, keep); }
  const counts = {};
  for (const id of list) { counts[id] = (counts[id] || 0) + 1; G.stock[id] = (G.stock[id] || 0) + SP[id].por; G.seen[id] = true; }
  G.money += d.coins; G.best = Math.max(G.best, Math.round(d.deepest));
  if (ok) G.tut.boat = true;
  save();
  const rows = SP_ORDER.filter(id => counts[id]).map(id =>
    `<div class="chip"><span><img src="${iconURL(id)}" alt="">${counts[id]}× ${SP[id].name}</span><small>${counts[id] * SP[id].por} ${counts[id] * SP[id].por === 1 ? "Portion" : "Portionen"}</small></div>`).join("");
  const open = stockTotal() > 0;
  $("summaryBody").innerHTML =
    `<h2>${ok ? "Fang des Tages" : "Ohnmacht!"}</h2>` +
    (ok ? `<p>Tiefster Punkt: ${Math.round(d.deepest)} m${d.coins ? " · Schatz: +" + d.coins + " 🪙" : ""}</p>`
        : `<div class="note bad">Die Crew hat dich herausgezogen.<br><b>${lost ? lost + " Fang" + (lost > 1 ? "stücke" : "stück") + " verloren" : "Zum Glück war das Netz leer"}</b>${d.coins ? " · Schatz: +" + d.coins + " 🪙" : ""}</div>`) +
    `<div class="catch">${rows || '<div class="empty">Nichts im Netz.</div>'}</div>` +
    `<button class="big" id="btnSumNext" type="button">${open ? "Zur Sushi-Bar 🍣" : "Weiter"}</button>`;
  setState("summary");
  $("btnSumNext").onclick = () => { audioInit(); SFX.tap(); if (open) startServe(); else { G.day++; save(); showShop({ closed: true }); } };
}

/* ───────────── Tauchgang zeichnen ───────────── */
const WSTOPS = [[0, [64, 184, 226]], [700, [22, 108, 166]], [1500, [9, 46, 96]], [2700, [3, 11, 30]]];
function wcol(y, mul = 1) {
  y = clamp(y, 0, 2700);
  for (let i = 1; i < WSTOPS.length; i++) if (y <= WSTOPS[i][0]) {
    const a = WSTOPS[i - 1], b = WSTOPS[i], t = (y - a[0]) / (b[0] - a[0]);
    return `rgb(${lerp(a[1][0], b[1][0], t) * mul | 0},${lerp(a[1][1], b[1][1], t) * mul | 0},${lerp(a[1][2], b[1][2], t) * mul | 0})`;
  }
  return "rgb(3,11,30)";
}
function rockCol(y, light) { const t = clamp(y / FLOOR, 0, 1), k = light ? 1.5 : 1; return `rgb(${lerp(74, 20, t) * k | 0},${lerp(84, 28, t) * k | 0},${lerp(92, 48, t) * k | 0})`; }

function drawDiver(c, d) {
  c.save(); c.translate(d.x, d.y);
  if (d.inv > 0 && Math.floor(d.inv * 14) % 2) c.globalAlpha = .45;
  c.save(); c.scale(d.dir, 1); c.rotate(d.tilt + (d.alive ? 0 : .6));
  const kick = Math.sin(d.kick);
  for (const s of [-1, 1]) {
    c.save(); c.translate(-13, 2 + s * 2); c.rotate(s * kick * .32);
    c.fillStyle = "#1f2f40"; rr(c, -20, -3.5, 22, 7, 3.5); c.fill();
    c.fillStyle = "#ffcf33"; c.beginPath(); c.moveTo(-18, -3.5); c.lineTo(-35, -8); c.lineTo(-37, 0); c.lineTo(-35, 8); c.lineTo(-18, 3.5); c.closePath(); c.fill();
    c.restore();
  }
  c.fillStyle = "#ffcf33"; rr(c, -13, -16, 25, 9, 4.5); c.fill();
  c.fillStyle = "#a9b4be"; rr(c, 11, -14, 5, 5, 1.5); c.fill();
  c.fillStyle = "#ff6b4a"; rr(c, -17, -9, 35, 17, 8.5); c.fill();
  c.fillStyle = "#1f2f40"; rr(c, -4, -9, 5, 17, 1); c.fill();
  c.fillStyle = "#1f2f40"; circ(c, 21, -1, 10); c.fill();
  c.fillStyle = "#f4c9a0"; circ(c, 23, -.5, 8); c.fill();
  c.fillStyle = "#1f2f40"; rr(c, 22, -7.5, 10.5, 9.5, 3.5); c.fill();
  c.fillStyle = "#9fe8ff"; rr(c, 23.6, -6, 7.5, 6.5, 2.5); c.fill();
  c.fillStyle = "rgba(255,255,255,.7)"; rr(c, 24.6, -5.2, 2.2, 2.6, 1); c.fill();
  c.fillStyle = "#a9b4be"; rr(c, 26, 3, 6, 4, 2); c.fill();
  c.strokeStyle = "#1f2f40"; c.lineWidth = 2; c.beginPath(); c.moveTo(26, 5); c.quadraticCurveTo(14, 12, 6, -10); c.stroke();
  c.restore();
  // Harpunengewehr
  c.rotate(d.aim);
  c.fillStyle = "#f4c9a0"; rr(c, 2, -3, 12, 6, 3); c.fill();
  c.fillStyle = "#33475b"; rr(c, 8, -2.5, 20, 5, 2); c.fill();
  c.fillStyle = "#ffcf33"; rr(c, 10, 1, 5, 6, 1.5); c.fill();
  if (harp.state === "ready") { c.fillStyle = "#dfe8ef"; c.beginPath(); c.moveTo(26, -1.2); c.lineTo(36, -1.2); c.lineTo(36, -4); c.lineTo(43, 0); c.lineTo(36, 4); c.lineTo(36, 1.2); c.lineTo(26, 1.2); c.closePath(); c.fill(); }
  c.restore();
}

function drawDecor(c, o, t) {
  const sway = Math.sin(t * 1.3 + o.ph) * 5;
  if (o.type === "weed") {
    c.strokeStyle = o.col; c.lineWidth = 3; c.lineCap = "round";
    for (let i = 0; i < o.n; i++) { const ox = (i - (o.n - 1) / 2) * 6, h = o.h * (1 - i * .13); c.beginPath(); c.moveTo(o.x + ox, o.y); c.quadraticCurveTo(o.x + ox - sway, o.y - h * .5, o.x + ox + sway * 1.3, o.y - h); c.stroke(); }
  } else if (o.type === "coral") {
    c.strokeStyle = o.col; c.lineWidth = 4; c.lineCap = "round";
    for (let i = 0; i < o.n + 1; i++) {
      const a = -Math.PI / 2 + (i - o.n / 2) * .5, h = o.h * .7, x1 = o.x + Math.cos(a) * h, y1 = o.y + Math.sin(a) * h;
      c.beginPath(); c.moveTo(o.x, o.y); c.lineTo(x1, y1); c.stroke();
      c.beginPath(); c.moveTo(lerp(o.x, x1, .55), lerp(o.y, y1, .55)); c.lineTo(lerp(o.x, x1, .8) + 6, lerp(o.y, y1, .8) - 5); c.stroke();
    }
  } else {
    for (let i = 0; i < o.n; i++) { const ox = (i - (o.n - 1) / 2) * 9, h = o.h * (.5 + (i % 2) * .3); c.fillStyle = o.col; rr(c, o.x + ox - 3.5, o.y - h, 7, h, 3.5); c.fill(); c.fillStyle = "rgba(0,0,0,.3)"; c.beginPath(); c.ellipse(o.x + ox, o.y - h + 2, 2.4, 1.5, 0, 0, TAU); c.fill(); }
  }
}

function drawPickup(c, p, t) {
  if (p.type === "o2") {
    c.fillStyle = "#2f8f8a"; c.beginPath(); c.ellipse(p.x, p.y + 6, 13, 5, 0, 0, TAU); c.fill();
    if (p.taken) return;
    const b = Math.sin(p.t * 3) * 2;
    c.fillStyle = "rgba(160,240,255,.28)"; circ(c, p.x, p.y - 8 + b, 13); c.fill();
    c.strokeStyle = "rgba(200,250,255,.9)"; c.lineWidth = 1.6; circ(c, p.x, p.y - 8 + b, 13); c.stroke();
    c.fillStyle = "rgba(255,255,255,.8)"; circ(c, p.x - 5, p.y - 13 + b, 2.6); c.fill();
    txt(c, "O₂", p.x, p.y - 7 + b, 10, "#eaffff");
    for (let i = 0; i < 3; i++) { const k = (p.t * .6 + i / 3) % 1; c.globalAlpha = 1 - k; circ(c, p.x + Math.sin(k * 7 + i) * 6, p.y - 22 - k * 40, 2 + i * .5); c.stroke(); c.globalAlpha = 1; }
  } else if (p.type === "chest") {
    c.fillStyle = "#7a4a22"; rr(c, p.x - 14, p.y - 6, 28, 16, 3); c.fill();
    c.fillStyle = p.taken ? "#3b2410" : "#93602f"; rr(c, p.x - 15, p.y - (p.taken ? 20 : 13), 30, 10, 4); c.fill();
    c.fillStyle = "#ffcf33"; c.fillRect(p.x - 2.5, p.y - 8, 5, 8); if (!p.taken) { c.fillRect(p.x - 15, p.y - 6, 30, 2); const g = .5 + Math.sin(p.t * 4) * .5; c.globalAlpha = g * .8; txt(c, "✦", p.x + 12, p.y - 18, 10, "#fff3b0"); c.globalAlpha = 1; }
  } else if (p.type === "urchin" && !p.taken) { c.save(); c.translate(p.x, p.y); drawSp(c, "urchin", 20, p.t); c.restore(); }
}

function drawDive() {
  const c = ctx, d = diver, t = time;
  const camX = VW >= WW ? (WW - VW) / 2 : clamp(d.x - VW / 2, 0, WW - VW);
  const camY = clamp(d.y - VH * .45, -VH * .3, FLOOR + 50 - VH);
  const sx = shake > 0 ? rand(-1, 1) * shake * 14 : 0, sy = shake > 0 ? rand(-1, 1) * shake * 14 : 0;

  const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, wcol(camY)); g.addColorStop(1, wcol(camY + VH));
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);

  // Lichtstrahlen
  if (camY < 650) {
    const top = Math.max(0, -camY), lg = c.createLinearGradient(0, top, 0, top + 600); lg.addColorStop(0, "rgba(255,255,255,1)"); lg.addColorStop(1, "rgba(255,255,255,0)");

/* ───────────── Sushi-Bar ───────────── */
const SKIN = ["#f4c9a0", "#e3ab7b", "#c98a5a", "#8f5c3c", "#f8dcc0"], HAIR = ["#2b1d14", "#5a3a1e", "#15151c", "#b5651d", "#d9d9de", "#c0392b", "#3a5fa8"],
  SHIRT = ["#4f9bd9", "#e06b6b", "#6bc48f", "#b683d8", "#e8a23d", "#4bb8b0", "#d86a9c"];

function startServe() {
  const st = stars(), n = st >= 4 ? 5 : st >= 2 ? 4 : 3;
  R = { t: 0, dur: 50, seats: [], chef: { pos: (n - 1) / 2, target: null, queue: [], busy: 0, after: null, face: 1, carry: null }, spawn: .6, income: 0, tips: 0, happy: 0, angry: 0,
    pour: null, floats: [], reserved: {}, endT: 0, done: false, mult: 1 + .1 * st, startRep: G.rep };
  for (let i = 0; i < n; i++) R.seats.push({ state: "empty", t: 0, pat: 0, patMax: 1, sp: null, look: null, mood: 0, queued: false, pay: 0, tip: 0, bites: 0 });
  toast.t = 0; paused = false; ptrs.clear();
  setState("serve");
}
const avail = id => (G.stock[id] || 0) - (R.reserved[id] || 0);
function pickDish() {
  let tot = 0; const opts = [];
  for (const id of SP_ORDER) { const a = avail(id); if (a > 0) { const w = a * Math.sqrt(SP[id].price); opts.push([id, w]); tot += w; } }
  if (!opts.length) return null;
  let r = Math.random() * tot; for (const [id, w] of opts) { r -= w; if (r <= 0) return id; }
  return opts[0][0];
}
function seatGap() { return Math.min(96, (VW - 20 - inset.l - inset.r) / R.seats.length); }
function seatX(i) { return VW / 2 + (i - (R.seats.length - 1) / 2) * seatGap(); }
function counterY() { return Math.max(VH * .56, 200 + inset.t); }

function serveTap(x, y) {
  if (R.done) return;
  if (R.pour) { stopPour(); return; }
  if (y < 56 + inset.t) return;
  let bi = -1, bd = 1e9;
  for (let i = 0; i < R.seats.length; i++) { const dx = Math.abs(x - seatX(i)); if (dx < bd) { bd = dx; bi = i; } }
  if (bi < 0 || bd > seatGap() * .62) return;
  queueSeat(bi);
}
function queueSeat(i) {
  const s = R.seats[i]; if (!s || R.done || R.pour) return;
  if ((s.state === "order" || s.state === "tea" || s.state === "dirty") && !s.queued && R.chef.queue.length < 5) { s.queued = true; R.chef.queue.push(i); SFX.tap(); G.tut.serve = true; }
}
function stopPour() {
  const p = R.pour, s = R.seats[p.seat]; R.pour = null;
  if (p.fill >= p.z0 && p.fill <= p.z1) { const bonus = Math.round(SP[s.sp].price * .25) + 2; s.tip += bonus; rfloat("Perfekt! +" + bonus, seatX(p.seat), counterY() - 120, "#9ff0c0"); SFX.coin(); buzz(20); }
  else { rfloat(p.fill > p.z1 ? "Zu voll…" : "Zu wenig…", seatX(p.seat), counterY() - 120, "#ffb3a6"); SFX.fail(); }
  payAndLeave(p.seat);
}
function rfloat(s, x, y, col) { R.floats.push({ s, x, y, t: 0, col }); }
function payAndLeave(i) {
  const s = R.seats[i], sum = s.pay + s.tip;
  G.money += sum; R.income += sum; R.tips += s.tip; R.happy++; G.rep += 1;
  rfloat("+" + sum + " 🪙", seatX(i), counterY() - 96, "#ffe37a"); SFX.coin();
  s.state = "leave"; s.t = .55; s.mood = 1; s.queued = false; R.chef.queue = R.chef.queue.filter(q => q !== i);
}

function updateServe(dt) {
  time += dt;
  const ch = R.chef;
  if (R.done) { R.endT -= dt; if (R.endT <= 0) finishServe(); return; }
  R.t += dt;
  const closing = R.t >= R.dur;
  let anyAvail = false; for (const id of SP_ORDER) if (avail(id) > 0) { anyAvail = true; break; }

  // Gäste kommen
  R.spawn -= dt;
  if (R.spawn <= 0 && !closing && anyAvail) {
    const free = R.seats.map((s, i) => s.state === "empty" ? i : -1).filter(i => i >= 0);
    if (free.length) {
      const s = R.seats[pick(free)], id = pickDish();
      s.state = "arrive"; s.t = .5; s.sp = id; R.reserved[id] = (R.reserved[id] || 0) + 1; s.mood = 0; s.tip = 0; s.pay = 0;
      s.look = { skin: pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT), style: (Math.random() * 4) | 0 };
      R.spawn = Math.max(.7, 2.3 - .28 * stars()) * rand(.7, 1.3);
    } else R.spawn = .3;
  }

  // Plätze
  R.seats.forEach((s, i) => {
    if (s.state === "arrive") { s.t -= dt; if (s.t <= 0) { s.state = "order"; s.patMax = s.pat = 15; } }
    else if (s.state === "order") {
      if (!(ch.target === i && ch.busy > 0)) s.pat -= dt;
      if (s.pat <= 0) { R.reserved[s.sp]--; s.state = "leave"; s.t = .55; s.mood = -1; s.queued = false; ch.queue = ch.queue.filter(q => q !== i); R.angry++; G.rep = Math.max(0, G.rep - 2); rfloat("Zu langsam!", seatX(i), counterY() - 100, "#ffb3a6"); SFX.fail(); }
    }
    else if (s.state === "eating") { s.t -= dt; s.bites = clamp(Math.ceil(s.t / 1.1), 0, 3); if (s.t <= 0) { if (Math.random() < .38 && !closing) { s.state = "tea"; s.patMax = s.pat = 9; } else payAndLeave(i); } }
    else if (s.state === "tea") { if (!(R.pour && R.pour.seat === i)) { s.pat -= dt; if (s.pat <= 0) payAndLeave(i); } }
    else if (s.state === "leave") { s.t -= dt; if (s.t <= 0) s.state = s.mood > 0 ? "dirty" : "empty"; }
  });

  // Koch
  if (R.pour) { const p = R.pour; p.fill += p.speed * dt; if (p.fill >= 1.02) { p.fill = 1.02; stopPour(); } }
  else if (ch.busy > 0) { ch.busy -= dt; if (ch.busy <= 0 && ch.after) { const f = ch.after; ch.after = null; ch.target = null; f(); } }

    if (ch.target !== null) {
      const i = ch.target, s = R.seats[i], dx = i - ch.pos, step = 6.5 * dt;
      if (Math.abs(dx) > step) { ch.pos += Math.sign(dx) * step; ch.face = Math.sign(dx); }
      else {

        if (s.state === "order") {

            if (s.state !== "order") return;

            s.pay = Math.round(SP[s.sp].price * R.mult); s.tip = Math.round(SP[s.sp].price * .4 * clamp(s.pat / s.patMax, 0, 1));
            s.state = "eating"; s.t = 3.2; s.bites = 3; ch.carry = null; SFX.serve();
          };
        } else if (s.state === "tea") { ch.target = null; R.pour = { seat: i, fill: 0, speed: rand(.75, 1.15), z0: 0, z1: 0 }; R.pour.z0 = rand(.55, .7); R.pour.z1 = R.pour.z0 + .2; }
        else if (s.state === "dirty") { ch.busy = .28; ch.after = () => { if (s.state === "dirty") s.state = "empty"; SFX.tap(); }; }
        else { ch.target = null; ch.carry = null; }
      }
    }
  }

  for (const f of R.floats) { f.t += dt; f.y -= 26 * dt; }
  R.floats = R.floats.filter(f => f.t < 1.5);

  const busySeats = R.seats.some(s => s.state !== "empty" && s.state !== "dirty");
  if (!busySeats && !R.pour && (closing || !anyAvail)) { R.done = true; R.endT = 1.1; }
}

  G.day++; save(); showShop(res);
}

    `<h2>Tag ${G.day} · Am Hafen</h2>` + note +
    `<div class="row" style="margin-top:14px"><div class="coins">🪙 ${G.money}</div><div class="stars" title="Ruf">${starsHTML(st)}</div></div>` +
    `<div class="repbar"><div style="width:${Math.round(repFrac * 100)}%"></div></div>` +
    `<button class="big" id="btnDive" type="button">Abtauchen 🤿</button>` +
    `<h3>Ausrüstung</h3>${ups}` +
    `<h3>Kühlfach (Portionen)</h3><div class="chips">${stock}</div>` +
    `<h3>Logbuch ${seenN}/${SP_ORDER.length}${G.best ? " · Rekord " + G.best + " m" : ""}</h3><div class="chips">${log}</div>`;
  $("btnDive").onclick = () => { audioInit(); SFX.tap(); startDive(); };
  $("shopBody").querySelectorAll("[data-up]").forEach(b => b.onclick = () => {
    const k = b.dataset.up, cost = upCost(k);
    if (G.up[k] >= 4 || G.money < cost) return;
    audioInit(); G.money -= cost; G.up[k]++; save(); SFX.buy(); buzz(25);
    const sc = $("shopBody").scrollTop; renderShop(null); $("shopBody").scrollTop = sc;
  });
}

/* ───────────── Titel-Hintergrund ───────────── */
const attract = []; { const ids = ["sardine", "clown", "tang", "tuna", "puffer", "squid", "grouper", "lion", "jelly", "sardine", "tang", "clown"]; ids.forEach((id, i) => attract.push({ id, x: Math.random() * 900, y: .12 + .8 * ((i * .37) % 1), v: (id === "jelly" ? 6 : rand(16, 46)) * (i % 2 ? 1 : -1), ph: Math.random() * 9 })); }
function drawAttract(dt) {
  const c = ctx; time += dt;
  const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, "#2b9fd2"); g.addColorStop(.55, "#0f4f88"); g.addColorStop(1, "#04142e");
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  c.save(); c.globalAlpha = .08; c.fillStyle = "#fff";
  for (let i = 0; i < 5; i++) { const bx = ((i * 210 + time * 8) % (VW + 300)) - 150; c.beginPath(); c.moveTo(bx, 0); c.lineTo(bx + 50, 0); c.lineTo(bx - 90, VH * .8); c.lineTo(bx - 190, VH * .8); c.closePath(); c.fill(); }
  c.restore();
  for (const f of attract) {
    f.x += f.v * dt; const span = VW + 240; const x = ((f.x % span) + span) % span - 120, y = f.y * VH + Math.sin(time * .8 + f.ph) * 10;
    c.save(); c.translate(x, y); if (f.id !== "jelly") c.scale(f.v > 0 ? 1 : -1, 1); c.globalAlpha = .9; drawSp(c, f.id, SP[f.id].L * 1.3, time + f.ph, { puff: 0 }); c.restore();
  }
  c.strokeStyle = "rgba(220,245,255,.35)"; c.lineWidth = 1;
  for (let i = 0; i < 16; i++) { const k = (time * .05 * (1 + i % 3) + i * .13) % 1; circ(c, (i * 97.3) % VW + Math.sin(time + i) * 6, VH * (1 - k), 2 + i % 4); c.stroke(); }
}

/* ───────────── Eingabe ───────────── */
canvas.addEventListener("pointerdown", e => {
  e.preventDefault(); audioInit();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const p = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(), moved: false };
  ptrs.set(e.pointerId, p);
  if (paused) return;
  if (state === "dive") { if (!joy) joy = p; else { fire(); p.fired = true; } }
  else if (state === "serve") serveTap(e.clientX / S, e.clientY / S);
});
canvas.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  const dx = p.x - p.ox, dy = p.y - p.oy, l = Math.hypot(dx, dy);
  if (l > 11) p.moved = true;
  if (p === joy && l > 62) { p.ox = p.x - dx / l * 62; p.oy = p.y - dy / l * 62; }
});
function ptrEnd(e) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (p === joy) {
    joy = null;
    if (state === "dive" && !paused && !p.moved && e.type === "pointerup" && performance.now() - p.t0 < 320) fire();
  }
}
canvas.addEventListener("pointerup", ptrEnd);
canvas.addEventListener("pointercancel", ptrEnd);
canvas.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys.add(k); audioInit();
  if (k === "Escape" || k === "p") { if (state === "dive" || state === "serve") setPaused(!paused); return; }
  if (paused) return;
  if (state === "dive" && k === " ") fire();
  if (state === "serve") { if (k === " " && R.pour) stopPour(); else if (k >= "1" && k <= "5") queueSeat(+k - 1); }
});
window.addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
window.addEventListener("blur", () => { keys.clear(); joy = null; ptrs.clear(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && (state === "dive" || state === "serve")) setPaused(true); });

function setPaused(v) { paused = v; $("pause").classList.toggle("show", v); joy = null; ptrs.clear(); keys.clear(); }
$("pauseBtn").onclick = () => { audioInit(); setPaused(true); };
$("btnResume").onclick = () => setPaused(false);
function soundLabel() { $("btnSound").textContent = "Ton: " + (muted ? "aus" : "an"); }
$("btnSound").onclick = () => { muted = !muted; try { localStorage.setItem("tiefblau-mute", muted ? "1" : "0"); } catch (e) {} soundLabel(); audioInit(); SFX.tap(); };
$("btnFull").onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) { const r = f.call(el); if (r && r.catch) r.catch(() => {}); } }
};
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $("btnFull").style.display = "none";
$("btnQuit").onclick = () => { setPaused(false); load(); showTitle(); };

function showTitle() {
  hasSave = load();
  $("btnPlay").textContent = hasSave ? "Weiter · Tag " + G.day : "Abtauchen";
  $("btnNew").style.display = hasSave ? "block" : "none"; $("btnNew").textContent = "Neues Spiel"; newArmed = false;
  setState("title");
}
let newArmed = false;
$("btnPlay").onclick = () => { audioInit(); SFX.tap(); if (hasSave) showShop(null); else { G = freshGame(); startDive(); } };
$("btnNew").onclick = () => {
  audioInit();
  if (!newArmed) { newArmed = true; $("btnNew").textContent = "Spielstand wirklich löschen?"; return; }
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  G = freshGame(); hasSave = false; startDive();
};

/* ───────────── Schleife ───────────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  if (state === "dive") { if (!paused) updateDive(dt); if (state === "dive") drawDive(); else if (state === "summary") drawDive(); else drawAttract(0); }
  else if (state === "summary") drawDive();
  else if (state === "serve") { if (!paused) updateServe(dt); if (state === "serve") drawServe(); else drawAttract(0); }
  else drawAttract(dt);
  requestAnimationFrame(frame);
}
soundLabel();
showTitle();
requestAnimationFrame(frame);

if (location.hash === "#debug") window.__tb = { get G() { return G; }, get R() { return R; }, get diver() { return diver; }, get world() { return world; }, get harp() { return harp; }, startServe, startDive, showShop, endDive, save, get state() { return state; } };
})();
